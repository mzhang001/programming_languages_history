influences:
  - id: fortran-c-intro
    source: fortran
    destination: c-intro
    title: Declaration structure
    adopted: The placement of a declaration specifier before a list of names, transmitted through B.
    changed: C adds explicit type keywords to this declaration style.
    evidence: documented
    citations:
      - c-development
    caveat: An indirect influence through B, which is not yet a separate row.
  - id: algol-c-intro
    source: algol
    destination: c-intro
    title: Compound assignment
    adopted: ALGOL 68’s generalized assignment notation, transmitted through TMG and B.
    changed: Early C inherited the =+ spelling; the modern += ordering followed in 1976.
    evidence: documented
    citations:
      - c-development
    sourceMilestone: algol-68
    caveat: An indirect influence through intermediary languages, not a direct lineage claim.
