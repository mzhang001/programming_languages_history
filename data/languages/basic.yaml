      - basic-history
influences:
  - id: fortran-basic-intro
    source: fortran
    destination: basic-intro
    title: Accessible numerical programming
    adopted: FORTRAN-influenced expressions and numerical programming idioms.
    changed: BASIC emphasizes interactive use and a smaller beginner-oriented vocabulary.
    evidence: documented
    citations:
      - basic-history
  - id: algol-basic-intro
    source: algol
    destination: basic-intro
    title: Algorithmic language ideas
    adopted: Elements of ALGOL’s approach to expressing algorithms.
