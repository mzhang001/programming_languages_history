schemaVersion: 1
language:
  id: basic
  name: BASIC
  aliases:
    - Visual Basic
  introduction: basic-intro
  summary: A family of languages designed to make interactive programming approachable, later
    extending into structured and visual systems.
  paradigms:
    - Imperative
  scope: This family row includes distinct BASIC dialects. Implementation milestones are labeled; they
    do not imply that every dialect adopted the same features.
milestones:
  - id: basic-intro
    language: basic
