influences:
  - id: haskell-python-comprehensions
    source: haskell
    sourceMilestone: haskell-intro
    destination: python-comprehensions
    title: Comprehensions
    adopted: Haskell's comprehension notation for expressing a sequence transformation with generators
      and conditions.
    changed: Python list comprehensions eagerly construct lists within a dynamically typed,
      multi-paradigm language.
    evidence: documented
    citations:
      - python-functional
      - python-comprehensions
    examples:
      source: "[x * x | x <- [1..5], odd x]"
      destination: "[x * x for x in range(1, 6) if x % 2]"
      explanation: Both select odd inputs and square them. Python constructs the resulting list eagerly;
        Haskell lists are lazy.
