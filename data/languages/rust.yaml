    source: haskell
    destination: rust-1
    title: Trait-based abstraction
    adopted: Typeclass ideas and associated-type abstractions.
    changed: Rust traits work within an ownership-oriented language with eager evaluation.
    evidence: documented
    citations:
      - rust-influences
  - id: scheme-rust-1
    source: scheme
    destination: rust-1
    title: Hygienic macros
    adopted: Macro hygiene as a way to avoid unintended name capture.
