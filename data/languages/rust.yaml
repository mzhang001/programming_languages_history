influences:
  - id: cpp-rust-1
    source: cpp
    destination: rust-1
    title: Deterministic resource management
    adopted: RAII, references, and move-oriented resource management.
    changed: Ownership and borrowing constrain aliasing and lifetimes at compile time.
    evidence: documented
    citations:
      - rust-influences
  - id: ml-rust-1
    source: ml
    destination: rust-1
    title: Types that describe alternatives
    adopted: Algebraic data types, pattern matching, and type inference from the ML family.
    changed: Rust combines these tools with ownership and explicit systems-level control.
    evidence: documented
    citations:
      - rust-influences
    caveat: The reference names SML and OCaml; this catalog groups the family under ML.
